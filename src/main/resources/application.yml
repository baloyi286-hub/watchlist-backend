server:
  port: ${PORT:8080}

spring:
  application:
    name: watchcue
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout: 10000
      idle-timeout: 30000
      max-lifetime: 120000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

watchcue:
  youtube:
    api-key: ${YOUTUBE_API_KEY:}
  tv:
    notification-url: ${TV_NOTIFICATION_URL:}
    api-key: ${TV_API_KEY:}
